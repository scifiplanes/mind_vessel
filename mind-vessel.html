<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MIND//VESSEL - indirect-control prototype</title>
<style>
@font-face{font-family:"Perfect DOS VGA 437";src:url("PerfectDOS.ttf") format("truetype");font-display:swap}
:root{
  --bg:#b4b4b4; --panel:#c4c4c4; --fg:#121212; --dim:#4e4e4e; --line:#161616;
  --sel-bg:#161616; --sel-fg:#e6e6e6; --bar:#8e8e8e; --key:#121212; --keyfg:#e6e6e6;
  --amber:#8a5000; --red:#9a1410; --cyan:#0a5e62;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000;--panel:#101010;--fg:#bdbdbd;--dim:#6e6e6e;--line:#8c8c8c;--sel-bg:#b4b4b4;--sel-fg:#050505;--bar:#262626;--key:#000;--keyfg:#bdbdbd;--amber:#e0a040;--red:#e2503c;--cyan:#5cc4c4;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--panel:#101010;--fg:#bdbdbd;--dim:#6e6e6e;--line:#8c8c8c;--sel-bg:#b4b4b4;--sel-fg:#050505;--bar:#262626;--key:#000;--keyfg:#bdbdbd;--amber:#e0a040;--red:#e2503c;--cyan:#5cc4c4;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Perfect DOS VGA 437","Lucida Console","Courier New",ui-monospace,monospace;font-size:16px;line-height:1;overflow:hidden;-webkit-font-smoothing:none;font-smooth:never}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0 .25em;cursor:pointer;line-height:1.1}
button:hover,button:focus-visible{background:var(--sel-bg);color:var(--sel-fg);outline:none}
.dim{color:var(--dim)} .acc{color:var(--amber)} .bad{color:var(--red)} .ok{color:var(--cyan)}
.row{display:flex;gap:.45em;padding:0 .3em;white-space:pre;align-items:baseline}
.row .r{margin-left:auto}
.tree{padding:0 .3em;white-space:pre}
.tree.wrap{white-space:normal;padding-left:1.3em;text-indent:-1em}
.tip{cursor:help;border-bottom:1px dotted var(--dim)}
.lk{cursor:pointer;border-bottom:1px dotted var(--dim)}
.lk:hover,.lk:focus-visible{background:var(--sel-bg);color:var(--sel-fg);outline:none}
.stats{display:grid;grid-template-columns:repeat(4,max-content);gap:0 1em;padding:0 .3em}
.stats span{cursor:help;border-bottom:1px dotted var(--dim)}
.chip{border:1px solid var(--line);padding:0 .45em;font-size:.9em}
.chip.on{background:var(--sel-bg);color:var(--sel-fg)}
/* header */
.menubar{display:flex;align-items:center;gap:.8em;padding:0 .5em;background:var(--sel-bg);color:var(--sel-fg);white-space:nowrap;min-height:1.6em}
.menubar button{color:inherit;min-width:1.6em}
.menubar button:hover,.menubar button:focus-visible{background:var(--sel-fg);color:var(--sel-bg)}
#hdr-site{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.hb{display:inline-flex;align-items:center;gap:.3em}
.hb i{display:inline-block;width:56px;height:8px;background:rgba(128,128,128,.35);position:relative}
.hb i b{position:absolute;inset:0 auto 0 0;background:currentColor}
.hb.low{color:#e2503c}
/* stage */
#stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 6px 4px}
.viewwrap{position:relative;flex:1;min-height:0;background:#000;border:4px double var(--line);overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block;cursor:crosshair}
#tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:none;font-size:16px;color:#cfcfcf;white-space:nowrap;line-height:1.1;z-index:1;text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000}
#tag b{color:#e0a040;font-weight:normal} #tag i{color:#8a8a8a;font-style:normal}
.bark{position:absolute;transform:translate(-50%,-100%);pointer-events:none;font-size:16px;line-height:1;white-space:nowrap;color:#cfcfcf;z-index:1;text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000}
.bark.news{pointer-events:auto;cursor:pointer;white-space:normal;width:max-content;max-width:250px;text-align:center;background:rgba(0,0,0,.72);border:1px solid #5e5e5e;padding:1px 5px;line-height:1.15;z-index:2}
.bark.feed{color:#9ad8d0}
.bark.good{color:#7ad0c8}.bark.bad{color:#ea6650}.bark.idea{color:#e8a848}.bark.speech{color:#ededed}.bark.dim{color:#8a8a8a}
/* overlays inside the world: duct markers, toasts, card, drawer, map */
.ov{background:rgba(0,0,0,.84);color:#d0d0d0;border:1px solid #5e5e5e;font-size:16px;line-height:1.15}
.ov .acc{color:#e0a040}.ov .dim{color:#8a8a8a}.ov .bad{color:#ea6650}.ov .ok{color:#7ad0c8}
.ov button:hover,.ov button:focus-visible{background:#d0d0d0;color:#000}
/* Simple mode */
.ico{display:inline-block;width:14px;height:14px;flex:none;background:currentColor;-webkit-mask:var(--g) center/contain no-repeat;mask:var(--g) center/contain no-repeat;vertical-align:-2px;image-rendering:pixelated}
.ico.tiny{width:8px;height:8px}
.band{width:3px;align-self:stretch;flex:none;border-radius:1px}
.hb .s{display:none}
#app.simple .hb .w{display:none}
#app.simple .hb .s{display:inline-block}
#app.simple .dockbar .tabs,#app.simple #now,#app.simple #mdetail,#app.simple #libbar,#app.simple #libinfo,#app.simple #drawer-sub{display:none}
#app.simple.lay-bottom #pane-mind:not([hidden]){grid-template-columns:minmax(230px,1fr) minmax(300px,1.6fr)}
#app.simple .th{gap:.4em}
#app.simple .th .why{display:flex;gap:.3em;align-items:center}
#app.simple .th .cond{color:var(--red)}
#dock-back{display:none}
#app.simple #dock-back.on{display:inline}
.th.drop[data-prev]::after{content:attr(data-prev);color:var(--amber);margin-left:.4em}
#capline.full{animation:capfull .6s}
@keyframes capfull{30%{color:var(--red)}}
#b-pause.alert{animation:palert 1.2s 2}
@keyframes palert{50%{background:var(--amber);color:#000}}
.addrow{display:block;width:calc(100% - 1em);margin:3px .5em;border:1px dashed var(--dim);color:var(--dim);text-align:center;padding:2px 0;font-size:1.1em}
.addrow:hover,.addrow:focus-visible{border-color:var(--amber);color:var(--amber);background:none}
.vrow{display:flex;gap:8px;padding:1px 0 4px 2.6em}
.vrow .v{opacity:.35;display:inline-flex;align-items:flex-start}
.vrow .v.run{opacity:1;color:var(--amber)}.vrow .v.x{opacity:1;color:var(--red)}.vrow .v.none{opacity:.6}
.attn{height:3px;margin:0 .5em 2px 2.6em;background:rgba(128,128,128,.25)}
.attn b{display:block;height:100%;background:var(--amber)}
.card .ct .ico{margin-right:2px}
.card.acts{animation:actpulse 1.6s ease-in-out infinite}
@keyframes actpulse{50%{box-shadow:inset 0 0 0 1px #e0a040}}
#card .sw{display:inline-block;width:8px;height:8px;margin:0 2px 0 4px}
#card .gear,#card .pk{display:inline-flex;align-items:center;white-space:nowrap;margin-right:.35em;border-bottom:0}
#card .pk.ed{box-shadow:inset 0 -1px 0 #7ad0c8}
#card .lk.gear:hover,#card .lk.pk:hover{background:#d0d0d0;color:#000}
#card .mb{display:inline-block;width:46px;height:5px;background:rgba(128,128,128,.35);margin:0 6px 0 2px;vertical-align:1px}
#card .mb b{display:block;height:100%}
@media (prefers-reduced-motion: reduce){.card.acts{animation:none;box-shadow:inset 0 0 0 1px #e0a040}}
#ducts{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .3s}
#ducts.on{opacity:1}
#ducts.on .duct{pointer-events:auto}
.duct{position:absolute;font-size:16px;line-height:1;background:rgba(0,0,0,.8);border:1px solid #5e5e5e;color:#cfcfcf;padding:0 5px;white-space:nowrap;cursor:pointer;font:inherit;font-size:16px}
.duct.rt{color:#e0a040;border-color:#e0a040}
.duct .p{color:#e0a040}
.duct:hover,.duct:focus-visible{background:#d0d0d0;color:#000;outline:none}
#hdr-site{cursor:pointer}
#toasts{position:absolute;top:6px;right:6px;z-index:6;display:flex;flex-direction:column;gap:4px;width:min(280px,62%);pointer-events:none}
.toast{pointer-events:auto;padding:3px 24px 3px 7px;cursor:pointer;position:relative;animation:tin .18s ease-out}
.toast .x{position:absolute;right:2px;top:1px}
.toast.here{border-color:#e0a040}.toast.near{border-color:#9a9a9a}
.toast .ic{color:#e0a040;margin-right:.3em}.toast.near .ic,.toast.region .ic{color:#9a9a9a}
.toast .more{color:#8a8a8a;font-size:.9em}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
#card{position:absolute;z-index:5;width:min(310px,84%);padding:3px 6px 5px;max-height:70%;overflow:auto}
#card[hidden]{display:none}
#card .ch{display:flex;gap:.5em;align-items:baseline;border-bottom:1px solid #5e5e5e;margin-bottom:3px}
#card .ch b{font-weight:normal;flex:1}
#card .tree,#card .row{padding:0 .1em}
#card .tree.wrap{padding:0 .1em 0 1.1em;text-indent:-1em}
#card .row,#card .tree{white-space:normal;overflow-wrap:anywhere;min-width:0}
#card .row{flex-wrap:wrap}
#card .sug{margin-top:4px;border-top:1px solid #5e5e5e;padding-top:3px}
#card .addb{border:1px solid #9a9a9a;padding:0 .4em;margin-left:.3em}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(400px,46%);z-index:4;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .18s ease-out;padding:4px}
#drawer.open{transform:none}
#drawer .dh{display:flex;align-items:center;gap:.5em;border-bottom:1px solid #5e5e5e;margin-bottom:4px}
#mapov{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.94);display:flex;flex-direction:column;padding:4px}
#mapov[hidden]{display:none}
#mapov .mh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;color:#cfcfcf;font-size:16px;padding:0 2px 4px}
#reg{flex:1;min-height:0;width:100%;object-fit:contain;image-rendering:pixelated;display:block;cursor:pointer}
#regcard{position:absolute;left:8px;bottom:8px;max-width:min(400px,80%);padding:3px 7px}
#regcard[hidden]{display:none}
.lg i{display:inline-block;width:8px;height:8px;margin-right:4px}
/* library (lives in the drawer on wide screens, in the dock on narrow ones) */
#libbar{display:flex;flex-wrap:wrap;gap:4px;padding:0 .2em 6px}
#libbar input{font:inherit;background:#000;color:#d0d0d0;border:1px solid #5e5e5e;padding:0 .3em;width:7em}
#libbar .chip{border-color:#5e5e5e}
#libbar .chip.on{background:#d0d0d0;color:#000}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:0 .2em 4px}
.card{border:1px solid #5e5e5e;padding:2px 5px;cursor:grab}
.card:hover{outline:1px dotted #cfcfcf;outline-offset:-1px}
.card.sel{background:#d0d0d0;color:#000}
.card.nofit{opacity:.55}
.card .ct,.card .cs{display:flex;gap:.4em;align-items:baseline}
.card .r{margin-left:auto}
.card .cv,.card .cs{color:#8a8a8a;font-size:.85em;line-height:1.1}
.card.sel .cv,.card.sel .cs{color:inherit}
.star{color:#e0a040}
.new{color:#e0a040}
#libinfo{white-space:pre-wrap;color:#8a8a8a;border-top:1px solid #5e5e5e;margin-top:4px;padding:2px .2em;font-size:.9em;min-height:2.2em}
.scroll{overflow:auto;min-height:0;flex:1}
/* dock: the live Mind under the world */
#dock{flex:none;height:min(32vh,320px);min-height:120px;border:4px double var(--line);border-top:0;background:var(--panel);display:flex;flex-direction:column}
#dock.peek{height:auto;min-height:0}
#dock.peek .dpane,#dock.peek #now{display:none}
.dockbar{display:flex;align-items:center;gap:6px;padding:1px 6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dockbar .tabs{display:flex;gap:4px}
.dockbar .tabs button{border:1px solid var(--line);padding:0 .45em}
.dockbar .tabs button.on{background:var(--sel-bg);color:var(--sel-fg)}
.dockbar .sp{flex:1}
#handle{display:none;width:44px;height:14px;border:0;padding:0;align-self:center;background:transparent}
#handle::before{content:'';display:block;width:36px;height:4px;margin:5px auto;background:var(--dim)}
#strip{display:none;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#dock.peek #strip{display:block}
.dpane{flex:1;min-height:0;overflow:auto}
.dpane[hidden]{display:none}
#now{border-top:1px solid var(--line);padding:1px .4em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mindrows{display:block}
.th .no{color:var(--dim);width:1.3em;text-align:right;flex:none}
.th.sel .no{color:inherit}
.th [data-rm]{margin-left:.2em}
@media (hover:hover){.th [data-rm]{visibility:hidden}.th:hover [data-rm],.th:focus-within [data-rm],.th.sel [data-rm],.th.kb [data-rm]{visibility:visible}}
.th .why{flex:1}
#mdetail{display:none;padding:0 .3em}
#mdetail h4,.vsec h4{margin:0 0 2px;font:inherit;color:var(--dim);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vgrid{display:grid;grid-template-columns:1fr;gap:6px;padding:2px .2em}
.vsec{min-width:0}
/* wide screens: the Mind is a column beside the world */
#app.lay-side #stage{flex-direction:row}
#app.lay-side #dock{height:auto;width:clamp(320px,27vw,460px);border:4px double var(--line);border-left:0}
#app.lay-side #dock-min{display:none}
/* narrower desktop: the dock under the world in three panes, Library always open */
#app.lay-bottom #dock{height:min(36vh,330px)}
#app.lay-bottom #pane-mind:not([hidden]){display:grid;grid-template-columns:minmax(210px,1fr) minmax(230px,1.1fr) minmax(280px,1.5fr)}
#app.lay-bottom #pane-mind>*{overflow:auto;min-height:0;border-right:1px solid var(--line)}
#app.lay-bottom #pane-mind>*:last-child{border-right:0}
#app.lay-bottom #mdetail{display:block}
#app.lay-bottom .vgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
#app.lay-bottom [data-t="lib"]{display:none}
#app.lay-bottom #drawer,#app.lay-phone #drawer{display:none}
/* the Library when it sits in the dock rather than over the world */
#dock #libbar input{background:var(--panel);color:var(--fg);border-color:var(--line)}
#dock #libbar .chip,#dock .card{border-color:var(--line)}
#dock #libbar .chip.on,#dock .card.sel{background:var(--sel-bg);color:var(--sel-fg)}
#dock .card .cv,#dock .card .cs,#dock #libinfo{color:var(--dim)}
#dock .card.sel .cv,#dock .card.sel .cs{color:inherit}
#dock .card:hover{outline-color:var(--fg)}
#dock #libinfo{border-color:var(--line)}
#dock #lib-pane{padding-top:2px}
.th{cursor:grab}
.th:hover{outline:1px dotted var(--fg);outline-offset:-1px}
.th.sel{background:var(--sel-bg);color:var(--sel-fg)}
.th .hd{color:var(--dim)}
.th .ic{width:1em;text-align:center;flex:none}
.th .nm{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.th .why{color:var(--dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:.85em}
.th.sel .why,.th.sel .hd{color:inherit}
.st-run .ic,.st-run .nm{color:var(--amber)} .th.sel.st-run .nm{color:inherit}
.st-x .ic{color:var(--red)}
.st-p .ic,.st-p .nm{color:var(--dim)}
.st-below{opacity:.62}
.row.sub{font-size:.9em}
.th.kb{box-shadow:inset 3px 0 0 var(--fg)}
.th.drop{box-shadow:inset 0 2px 0 var(--amber)}
.slot{display:none;width:100%;text-align:left;border:1px dashed var(--amber);color:var(--amber);padding:0 .4em;margin:1px 0}
#mindrows.placing .slot{display:block}
#mindrows:focus-visible{outline:1px dotted var(--fg);outline-offset:-2px}
.thb{display:none}
.vtabs{display:flex;gap:4px;padding:2px .3em}
.vtabs button{border:1px solid var(--line);padding:0 .45em}
.vtabs button.on{background:var(--sel-bg);color:var(--sel-fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:3px;padding:2px .3em}
.cell{border:1px solid var(--line);padding:0 3px;display:flex;align-items:center;gap:4px;cursor:pointer;font-size:.9em;white-space:nowrap;overflow:hidden}
.cell b{margin-left:auto;font-weight:normal}
.cell .sw{width:7px;height:7px;flex:none}
.cell.ed{box-shadow:inset 0 0 0 1px var(--cyan)} .cell.wn{border-style:dashed}
#logbar{display:flex;flex-wrap:wrap;gap:4px;padding:2px .3em;align-items:center}
#log .ln{padding:0 .3em;white-space:pre-wrap;cursor:pointer}
#log .ln.region{color:var(--amber)}
/* menu */
#menu{position:fixed;right:6px;top:1.8em;z-index:25;background:var(--panel);border:4px double var(--line);padding:4px 6px;width:min(320px,94vw);max-height:80vh;overflow:auto}
#menu[hidden]{display:none}
#debug{position:fixed;right:6px;top:1.8em;z-index:26;background:var(--panel);border:4px double var(--line);padding:4px 8px 6px;width:min(340px,94vw);max-height:84vh;overflow:auto}
#debug[hidden]{display:none}
#debug h3{margin:.5em 0 .1em;font:inherit;color:var(--dim);border-bottom:1px solid var(--line)}
#debug label{display:flex;align-items:center;gap:.5em;padding:.1em 0;cursor:pointer}
#debug label span{flex:1}
#debug input[type=range]{width:9em}
#debug select{font:inherit;background:var(--panel);color:var(--fg);border:1px solid var(--line)}
#debug .dh{display:flex;align-items:center}
#debug .dh b{flex:1;font-weight:normal}
#debug output{min-width:2.4em;text-align:right;color:var(--dim)}
#menu h3{margin:.4em 0 .1em;font:inherit;color:var(--dim)}
#menu .mi{display:flex;width:100%;text-align:left;padding:.15em .3em;gap:.5em}
#menu .mi .r{margin-left:auto;color:var(--dim)}
/* dialogs and coach */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.overlay[hidden]{display:none}
.panel{position:relative;border:4px double var(--line);background:var(--panel);display:flex;flex-direction:column;padding:9px 4px 4px}
.panel>h2{position:absolute;top:-.62em;left:0;right:0;margin:0;font:inherit;text-align:center;pointer-events:none;white-space:nowrap}
.panel>h2 span{background:var(--panel);padding:0 .4em}
.dlg{max-width:660px;width:100%;overflow:visible}
.dlg .body{padding:.4em .7em;line-height:1.15;overflow:auto;max-height:70vh}
.dlg .body p{margin:.45em 0}
.dlg .btns{text-align:center;padding:.4em}
#coach{position:fixed;z-index:30;background:var(--panel);color:var(--fg);border:4px double var(--line);padding:6px 9px;line-height:1.15}
#coach[hidden]{display:none}
#coach .cb{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:6px}
.coached{outline:3px solid var(--amber)!important;outline-offset:2px}
.flash{outline:2px solid var(--amber);outline-offset:-2px}
/* narrow screens: world on top, the dock becomes a bottom sheet with three heights */
@media (max-width:860px){
  body{font-size:16px}
  html,body{height:100%}
  #stage{padding:0}
  /* the sheet hugs its list; the world takes the rest and crops in, so neither region is an empty band */
  .viewwrap{flex:1 1 auto;width:100%;height:auto;max-height:none;aspect-ratio:auto;min-height:38%;margin:0;border-width:0 0 1px 0}
  #cv{object-fit:cover}
  #dock{flex:0 1 auto;height:auto;max-height:46%;min-height:0;border:0}
  #dock .dpane{flex:0 1 auto;min-height:0}
  #app.sheet-full .viewwrap{flex:0 0 32%;min-height:0}
  #app.sheet-full #dock{flex:1 1 auto;max-height:none}
  #app.sheet-full #dock .dpane{flex:1 1 auto}
  #app.sheet-peek .viewwrap{flex:1 1 auto;min-height:0}
  #app.sheet-peek #dock{flex:none;max-height:none;margin-top:auto}
  #handle{display:block}
  #mindrows{grid-template-columns:1fr}
  .thb{display:inline}
  .hb i{width:34px}
  #hdr-site{font-size:16px}
  #drawer{display:none}
  .dockbar .tabs button{min-height:32px}
  .th{min-height:30px;align-items:center}
  .thb button{min-width:32px;min-height:28px}
  #card{left:4px!important;right:4px;bottom:4px;top:auto!important;width:auto;max-height:62%}
  #toasts{width:min(260px,78%)}
  .toast{font-size:16px}
}

// energy value of one unit of a material for a diet
function edible(src,m){
  const M=MATS[m];if(!M)return 0;
  switch(src){
    case'organic':return(M.organic||0)*10;
    case'flesh':return m==='flesh'||m==='sinew'||m==='meal'?(M.organic||0)*11:0;
    case'rot':return(M.organic||0)*9;
    case'power':return(M.power||0)*10;
    case'echo':return(M.echo||0)*10;
    case'heat':return(M.fuel||0)*10;
    case'mineral':return(M.mineral||0)*10;
    case'fluid':return(M.fluid||0)*10;
  }
  return 0;
}

function pickByRegBias(keys,getReg,reg){
  if(!reg||!keys.length)return PICK(keys);
  const w=keys.map(k=>{const r=getReg(k);return!r?1:r===reg?3.2:.4});
  let r=R()*w.reduce((a,b)=>a+b,0);for(let i=0;i<keys.length;i++){r-=w[i];if(r<=0)return keys[i]}return keys[0];
}
function rollTraits(reg){
  const n=1+(R()<.55)+(R()<.2);const pool=TRAITS.slice(),o=[];
  while(o.length<n&&pool.length){const k=pickByRegBias(pool.map((_,i)=>i),i=>pool[i].reg,reg);o.push(pool.splice(k,1)[0].n)}
  return o}

function buildSprite(mask,pal,mode){
  const c=document.createElement('canvas');c.width=10;c.height=10;const g=c.getContext('2d');
  for(let y=0;y<mask.length;y++)for(let x=0;x<mask[y].length;x++){
    const k='abce'.indexOf(mask[y][x]);if(k<0)continue;
    let col=pal[k];
    if(mode==='w')col='#f2eee2';else if(mode==='h')col=k===3?'#c8402c':shade(col,.8);else if(mode==='n'&&k!==3)col=shade(col,.9);
    g.fillStyle=col;g.fillRect(x,y,1,1);
  }
  return c;
}
const sprCache={};
function spriteOf(a,white,forced){
  const sp=a.comp.species,mode=white?'w':forced||(a.faction==='player'?'p':(player&&!wants(a,player)?'n':'h')),key=sp+mode;
  return sprCache[key]||(sprCache[key]=buildSprite(SPR[sp.toLowerCase()],SPECIES[sp].pal,mode));
}
function nodeSprite(o){
  const key='n'+o.mat;if(sprCache[key])return sprCache[key];
  const c=MATS[o.mat].c, pal=[c,shade(c,.5),shade(c,1.4),'#fff'];
  if(o.mat==='fungus')pal[2]='#a8e0d0';
  return sprCache[key]=buildSprite(o.mat==='fungus'||o.mat==='flesh'?SPR.bloom:SPR.heap,pal.map(v=>v[0]==='#'?v:rgb2hex(v)),'');
}
function rgb2hex(s){const m=s.match(/\d+/g).map(Number);return'#'+m.map(v=>v.toString(16).padStart(2,'0')).join('')}

function paintTile(d,W,ox,oy,tx,ty){

        case'speck':if(n>.86)b=[70,66,58];break;
        case'rock':if(n>.9)b=[36,36,40];else if(n<.1)b=[14,14,16];break;
        case'water':if(full){if(((px+py*2)%9)===0)b=[60,86,100]}else b=[30,30,32];break;

        case'meat':if(full){if((px+(py>>1))%4===0)b=[70,34,34]}else b=[40,28,26];break;

        case'bones':if((px*3+py*7)%11===0||(px+py*5)%13===0)b=[56,50,42];if(n>.9)b=[200,190,166];break;
        case'glass':if((px+py)%7===0)b=[110,140,150];if(px===0||py===0)b=[40,52,56];break;

<p><b>Energy</b>: every body burns it; each species feeds its own way. <b>Material world</b>: walls and floors come apart with their own verbs, refine over heat, assemble gear and tools, build.</p>
<p><b>Three registers of work</b> coexist across the region: Bone (smoke, hide, grit, rite), Plate (scrap, steam, stamp, meter), Lease (live lines, badge, wet lab). Sites lean one way or another; civilizations mix techniques, and parasite Thoughts cross the registers on purpose.</p>

// ================================================================ campaign persistence (world survives reload)
const CAMPAIGN_KEY='mindvessel.campaign.v1';
let campSaveT=null,bootingCampaign=false;
function serTA(a){
  if(!a)return null;
  const u=new Uint8Array(a.buffer,a.byteOffset,a.byteLength);
  let s='';const CH=0x8000;for(let i=0;i<u.length;i+=CH)s+=String.fromCharCode.apply(null,u.subarray(i,Math.min(i+CH,u.length)));
  return{t:a.constructor.name,b:btoa(s)};
}
function revTA(o){
  if(!o)return null;
  const u=Uint8Array.from(atob(o.b),c=>c.charCodeAt(0));
  const C=globalThis[o.t]||Uint8Array;return new C(u.buffer,u.byteOffset,Math.floor(u.byteLength/(C.BYTES_PER_ELEMENT||1)));
}
function serializeObj(o){
  const x={};for(const k in o){if(k==='civ'||k==='owner'){x[k]=o[k]&&typeof o[k]==='object'?o[k].id:o[k];continue}
    if(k==='know'&&o.know){x.know={sites:o.know.sites,explored:[...o.know.explored].map(([id,e])=>[id,serTA(e)])};continue}
    x[k]=o[k]}
  return x;
}
function reviveObj(x,civById){
  const o={...x};
  if(o.civ!=null)o.civ=civById.get(o.civ)||null;
  if(o.owner!=null)o.owner=civById.get(o.owner)||null;
  if(o.know)o.know={sites:o.know.sites||[],explored:new Map((o.know.explored||[]).map(([id,e])=>[id,revTA(e)]))};
  return o;
}
function serializeSiteDun(d){
  if(!d)return null;
  return{map:serTA(d.map),blk:serTA(d.blk),flr:serTA(d.flr),stock:serTA(d.stock),slick:serTA(d.slick||new Uint8Array(d.map.length)),
    ECHO:serTA(d.ECHO),POWER:serTA(d.POWER),bmat:[...(d.bmat||[])],lights:d.lights,rooms:d.rooms,
    startRoom:Math.max(0,d.rooms.indexOf(d.startRoom)),exits:d.exits,lvlSeed:d.lvlSeed,
    objs:(d.objs||[]).map(serializeObj)};
}
function reviveSiteDun(raw){
  if(!raw)return null;
  const rooms=raw.rooms,d={map:revTA(raw.map),blk:revTA(raw.blk),flr:revTA(raw.flr),stock:revTA(raw.stock),
    slick:revTA(raw.slick)||new Uint8Array(MW*MH),ECHO:revTA(raw.ECHO),POWER:revTA(raw.POWER),
    bmat:new Map(raw.bmat||[]),lights:raw.lights||[],rooms,startRoom:rooms[raw.startRoom]||rooms[0],
    exits:raw.exits||[],lvlSeed:raw.lvlSeed,objs:raw.objs||[],explored:new Uint8Array(MW*MH)};
  return d;
}
function serializeCiv(v){
  return{id:v.id,name:v.name,hue:v.hue,sites:[...v.sites],memes:[...v.memes],age:v.age,grudge:v.grudge||0,favour:v.favour||0,
    pairCd:v.pairCd||{},preachCd:v.preachCd||0,npreachCd:v.npreachCd||0,dead:!!v.dead,pop:v.pop,prevPop:v.prevPop,species:v.species};
}
function reviveCiv(raw){
  return{id:raw.id,name:raw.name,hue:raw.hue,sites:new Set(raw.sites||[]),memes:new Map((raw.memes||[]).map(([t,m])=>[t,{fit:m.fit}])),
    age:raw.age||0,grudge:raw.grudge||0,favour:raw.favour||0,pairCd:Object.assign({},raw.pairCd||{}),
    preachCd:raw.preachCd||0,npreachCd:raw.npreachCd||0,dead:!!raw.dead,pop:raw.pop,prevPop:raw.prevPop,species:raw.species};
}
function serializeVmem(v){
  return{explored:[...(v.explored||[])].map(([id,e])=>[id,serTA(e)]),surveyed:[...(v.surveyed||[])]};
}
function reviveVmem(raw){
  return{explored:new Map((raw.explored||[]).map(([id,e])=>[id,revTA(e)])),surveyed:new Set(raw.surveyed||[])};
}
function serializeActor(a){
  return{id:a.id,faction:a.faction,x:a.x,y:a.y,comp:a.comp,base:a.base,lvl:a.lvl,xp:a.xp||0,lvlStats:a.lvlStats||{},bless:a.bless||{},
    inv:a.inv||{},food:a.food||[],equip:a.equip,mind:a.mind.slice(),energy:a.energy,hp:a.hp,maxEnergy:a.maxEnergy,
    role:a.role,follower:!!a.follower,poly:a.poly,creature:!!a.creature,flora:!!a.flora};
}
function reviveActor(raw){
  const a=makeActor({faction:raw.faction,x:raw.x|0,y:raw.y|0,comp:raw.comp,base:raw.base,lvl:raw.lvl||1,mind:raw.mind,energy:raw.energy,role:raw.role});
  a.id=raw.id;a.xp=raw.xp||0;a.lvlStats=raw.lvlStats||{};a.bless=raw.bless||{};a.inv=raw.inv||{};a.food=raw.food||[];
  a.equip=raw.equip||{hand:null,body:null,trinket:null,tool:null};a.poly=raw.poly;a.follower=!!raw.follower;
  a.creature=!!raw.creature;a.flora=!!raw.flora;a.x=raw.x;a.y=raw.y;
  recalc(a);a.hp=Math.min(raw.hp!=null?raw.hp:a.maxHp,a.maxHp);a.maxEnergy=raw.maxEnergy||a.maxEnergy;a.energy=raw.energy!=null?raw.energy:a.energy;
  nextId=Math.max(nextId,raw.id+1);return a;
}
function flushCurDun(){
  if(!RG||!RG.inside)return;const s=RG.sites[RG.cur];if(!s||!s.dun)return;
  Object.assign(s.dun,{map,blk,flr,stock,bmat,lights,rooms,startRoom,exits,lvlSeed,ECHO,POWER,slick,
    objs:objs.filter(o=>!(o.k==='art'&&!o.inscribed)&&!(o.k==='item'&&o.it&&o.it.bait))});
  syncSite(s);
}
function clearCampaign(){try{localStorage.removeItem(CAMPAIGN_KEY)}catch(e){}}
function saveCampaign(){
  if(!RG||bootingCampaign)return;
  try{
    flushCurDun();
    const civs=RG.civs.map(serializeCiv);
    const sites=RG.sites.map(s=>{
      return{id:s.id,x:s.x,y:s.y,nb:s.nb,name:s.name,type:s.type,tier:s.tier,base:s.base,res:s.res,N:s.N,Q:s.Q,S:s.S,F:s.F,
        sp:s.sp,arts:s.arts,ruins:s.ruins,read:s.read,seed:s.seed,collapseT:s.collapseT,warT:s.warT,phase:s.phase,cx:s.cx,avail:s.avail,reg:s.reg,
        dun:serializeSiteDun(s.dun),dunPowered:s.dunPowered||0,civ:s.civ?s.civ.id:null,km:s.km||null,
        visited:!!s.visited,heardOf:!!s.heardOf,lastVisit:s.lastVisit,marked:s.marked,fallen:s.fallen||[],pulseT:s.pulseT};
    });
    const blob={ver:1,RG:{sites,start:RG.start,cur:RG.cur,prev:RG.prev,tick:RG.tick,civs,crit:RG.crit,news:RG.news||[],inside:!!RG.inside},
      cyc,newsId,nextId,gameTime,meta:{best:save.best},
      vessel:player?{save:{lib:save.lib,mind:save.mind,src:save.src,best:save.best,newT:[...(save.newT||[])]},
        vmem:serializeVmem(vmem),heardN:[...heardN],scanned:[...scanned],stats,depth,
        player:serializeActor(player),followers:followers().map(serializeActor)}:null};
    localStorage.setItem(CAMPAIGN_KEY,JSON.stringify(blob));
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({best:save.best}))}catch(e){}
  }catch(e){console.warn('campaign save failed',e)}
}
function scheduleCampaignSave(){if(bootingCampaign)return;if(campSaveT)clearTimeout(campSaveT);campSaveT=setTimeout(()=>{campSaveT=null;saveCampaign()},900)}
function loadCampaign(){
  let raw;try{raw=JSON.parse(localStorage.getItem(CAMPAIGN_KEY)||'null')}catch(e){return false}
  if(!raw||!raw.RG||!raw.RG.sites||!raw.RG.sites.length)return false;
  bootingCampaign=true;
  try{
    newsId=raw.newsId||0;nextId=raw.nextId||1;gameTime=raw.gameTime||0;cyc=raw.cyc||cyc;
    if(raw.meta&&raw.meta.best)save.best=Math.max(save.best,raw.meta.best);
    const civById=new Map((raw.RG.civs||[]).map(c=>{const v=reviveCiv(c);return[v.id,v]}));
    const sites=raw.RG.sites.map(s=>{
      const dun=reviveSiteDun(s.dun);
      if(dun)dun.objs=dun.objs.map(o=>reviveObj(o,civById));
      const site={...s,dun,civ:s.civ!=null?civById.get(s.civ)||null:null,ruins:s.ruins||[],read:s.read||[],fallen:s.fallen||[],nb:s.nb||[]};
      if(s.km)site.km=s.km;return site;
    });
    RG={sites,start:raw.RG.start,cur:raw.RG.cur,prev:raw.RG.prev,tick:raw.RG.tick||0,civs:[...civById.values()],
      crit:raw.RG.crit||0,news:raw.RG.news||[],events:[],flowIn:[],flowOut:[],inside:false};
    if(raw.vessel&&raw.vessel.player){
      const vs=raw.vessel;
      save.lib=vs.save.lib||START_LIB.slice();save.mind=vs.save.mind||DEFAULT_MIND.slice();save.src=vs.save.src||{};
      save.best=Math.max(save.best,vs.save.best||1);save.newT=new Set(vs.save.newT||[]);
      vmem=reviveVmem(vs.vmem||{explored:[],surveyed:[]});
      heardN=new Set(vs.heardN||[]);scanned.clear();for(const[k,v]of(vs.scanned||[]))scanned.set(k,v);
      stats=vs.stats||{kills:0,crafts:0,salvaged:0,checks:0,t:0};depth=vs.depth||1;
      player=reviveActor(vs.player);
      const fs=(vs.followers||[]).map(reviveActor);
      enterSite(RG.cur,RG.prev,fs);
      bootingCampaign=false;scheduleCampaignSave();return true;
    }
    bootingCampaign=false;return 'world';
  }catch(e){console.warn('campaign load failed',e);RG=null;bootingCampaign=false;return false}
}
addEventListener('beforeunload',()=>{try{saveCampaign()}catch(e){}});
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')try{saveCampaign()}catch(e){}});

// ================================================================ loop
let last=performance.now();
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused&&!dlgOpen&&!player.dead)for(let k=0;k<speed;k++)update(rdt);
  if(!paused&&!dlgOpen)updFx(rdt);
  if(lookAt){lookAt.t-=rdt;if(lookAt.t<=0)lookAt=null}
  if(player.dead&&deathT>0){deathT-=rdt;if(deathT<=0&&!dlgOpen)showDeath()}
  draw(now/1000);updTag();updBarks(paused||dlgOpen?0:rdt);
  uiT-=rdt;if(uiT<=0){uiT=.2;uiTick()}
  requestAnimationFrame(frame);
}
let uiT=0;
const resumed=loadCampaign()===true;if(!resumed)newVessel();
updFk();uiTick();
showDlg('MIND//VESSEL',START,resumed?'Continue':'Begin',()=>{let done=false;try{done=localStorage.getItem('mindvessel.coached4')==='1'}catch(e){}if(!done)coach(0)});
requestAnimationFrame(frame);
