# fly.toml app configuration file generated for mind-vessel on 2026-10-22T22:20:21+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mind-vessel'
primary_region = 'lhr'

[build]
[env]
  MIND_VESSEL_CLOUD = '1'
  PORT = '8080'
  WORLD_PATH = '/data/save.json'

[[mounts]]
  source = 'mind_vessel_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/api/status'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
