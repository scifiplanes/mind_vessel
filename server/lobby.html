<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIND//VESSEL — World lobby</title>
<style>
  :root{--bg:#0c0c0c;--fg:#d8d2c4;--dim:#7a7568;--line:#4a463c;--amber:#e0a040;--panel:#141414;--ok:#8cba7a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:18px/1.35 "Perfect DOS VGA 437 Win",ui-monospace,Menlo,Consolas,monospace;
    background:radial-gradient(1200px 600px at 50% -10%,#1a1814 0%,var(--bg) 55%);color:var(--fg);
    display:flex;align-items:center;justify-content:center;padding:24px}
  main{width:min(520px,100%);border:4px double var(--line);background:var(--panel);padding:28px 24px 22px}
  h1{margin:0 0 .2em;font:inherit;font-size:1.1em;letter-spacing:.06em;text-align:center}
  .sub{color:var(--dim);text-align:center;margin:0 0 1.2em;font-size:.9em}
  .code{font-size:2.2em;letter-spacing:.28em;text-align:center;padding:.25em 0 .4em;color:var(--amber);user-select:all}
  .row{display:flex;gap:8px;margin:.55em 0;flex-wrap:wrap}
  button,.btn{flex:1;min-width:120px;font:inherit;color:var(--fg);background:transparent;border:2px solid var(--line);padding:.55em .7em;cursor:pointer;text-align:center;text-decoration:none}
  button:hover,.btn:hover{border-color:var(--amber);color:var(--amber)}
  button.primary,.btn.primary{border-color:var(--amber);color:var(--amber)}
  .status{margin-top:1em;color:var(--dim);font-size:.85em;text-align:center}
  .status b{color:var(--ok);font-weight:normal}
  .block{margin-top:1.1em;padding-top:.85em;border-top:1px solid var(--line)}
  .block h2{margin:0 0 .45em;font:inherit;font-size:.95em;color:var(--amber)}
  .block p{margin:.35em 0;color:var(--dim);font-size:.85em;line-height:1.35}
  .block code,.link{color:var(--fg);word-break:break-all}
  .wait{color:var(--dim);text-align:center;padding:1em 0}
  label{display:block;color:var(--dim);font-size:.85em;margin:.7em 0 .25em}
  input{width:100%;font:inherit;background:#0a0a0a;color:var(--fg);border:1px solid var(--line);padding:.45em .55em}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</head>
<body>
<main>
  <h1>MIND//VESSEL</h1>
  <p class="sub">World is running</p>
  <div id="body"><p class="wait">Connecting…</p></div>
</main>
<script>
function withPw(url){
  const u=new URL(url,location.href);
  const pw=document.getElementById('pw');
  if(pw&&pw.value)u.searchParams.set('pw',pw.value);
  return u.toString();
}

function render(s){
  const el=document.getElementById('body');
  const code=s.code||'······';
  const global=s.globalInvite;
  const invite=s.inviteLinks&&s.inviteLinks[0];
  const pass=s.hasPassword?'<label>Password<br><input id="pw" type="password" placeholder="if you set one" autocomplete="off"></label>':'';

  el.innerHTML=`
    <div class="block" style="border:0;margin:0;padding:0">
      <h2>You (this computer)</h2>
      <div class="row">
        <a class="btn primary" id="playLocal" href="${s.playLocal||'/play'}">Play here</a>
      </div>
      <p>Opens the game already connected to this world.</p>
    </div>

    <div class="block">
      <h2>Friends anywhere (internet)</h2>
      ${global?`
        <p>Send this link — works from anywhere in the world:</p>
        <p class="link" id="globalText">${global}</p>
        <div class="row">
          <button type="button" class="primary" id="copyGlobal">Copy worldwide invite</button>
        </div>
        <p>${s.publicUrl&&/fly\.dev/i.test(s.publicUrl)?'Cloud host is online — share the link.':'They open it in a browser. Keep the Host app running while you play.'}</p>
      `:`
        <p class="pulse" id="globalWait">Opening worldwide link… a few seconds</p>
        <p>Needs internet. If this never appears, check the host log or Fly deploy.</p>
      `}
      ${pass}
    </div>

    <div class="block">
      <h2>Friends on your Wi‑Fi</h2>
      ${invite?`
        <p class="link" id="inviteText">${invite}</p>
        <div class="row">
          <button type="button" id="copyInvite">Copy Wi‑Fi invite</button>
        </div>
      `:`
        <p>No Wi‑Fi address found (optional if you use the worldwide link).</p>
      `}
    </div>

    <div class="block">
      <h2>Join code <span style="color:var(--dim);font-size:.85em">(this computer only)</span></h2>
      <div class="code">${code}</div>
      <div class="row">
        <button type="button" id="copy">Copy code</button>
      </div>
      <p>Short codes stay on this Mac. Prefer the worldwide invite above for friends.</p>
    </div>

    <p class="status">Players online: <b id="n">${s.players|0}</b> · World: <b id="wname">${s.worldName||'save'}</b></p>
    <div class="block">
      <p>Stop the world: Quit <b>MIND VESSEL Host</b> from the Dock.</p>
    </div>`;

  const playLocal=document.getElementById('playLocal');
  if(playLocal){
    playLocal.href=withPw(s.playLocal||'/play');
    document.getElementById('pw')?.addEventListener('input',()=>{
      playLocal.href=withPw(s.playLocal||'/play');
    });
  }
  document.getElementById('copy')?.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(code);document.getElementById('copy').textContent='Copied'}catch(e){}
  });
  document.getElementById('copyInvite')?.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(withPw(invite));document.getElementById('copyInvite').textContent='Copied'}catch(e){}
  });
  document.getElementById('copyGlobal')?.addEventListener('click',async()=>{
    try{await navigator.clipboard.writeText(withPw(global));document.getElementById('copyGlobal').textContent='Copied'}catch(e){}
  });
}

let hadGlobal=false;
async function load(){
  const r=await fetch('/api/status');
  const s=await r.json();
  hadGlobal=!!s.globalInvite;
  render(s);
  setInterval(async()=>{
    try{
      const s2=await(await fetch('/api/status')).json();
      const n=document.getElementById('n');if(n)n.textContent=String(s2.players|0);
      const wn=document.getElementById('wname');if(wn&&s2.worldName)wn.textContent=s2.worldName;
      if(s2.globalInvite&&!hadGlobal){hadGlobal=true;render(s2)}
      else if(s2.code&&document.querySelector('.code')&&!document.querySelector('.code').textContent.includes(s2.code.slice(0,2)))location.reload();
    }catch(e){}
  },1500);
}
load().catch(()=>{document.getElementById('body').innerHTML='<p class="wait">Host not ready.</p>'});
</script>
</body>
</html>
